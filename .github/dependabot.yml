version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # A PR's title becomes its commit on main, so it follows Conventional
    # Commits: "build(deps): bump …" and "build(deps-dev): bump …".
    commit-message:
      prefix: build
      include: scope
    groups:
      # One weekly PR for every minor and patch update. Each major gets its own.
      minor-and-patch:
        update-types: [minor, patch]
        # Auth updates get their own PRs, and their own review.
        exclude-patterns:
          - better-auth
          - "@better-auth/*"
    ignore:
      # Storybook's Vitest addon supports Vitest 3 and 4 only (system design
      # §6, question 5), and Cloudflare's Vitest plugin needs 4. Drop this
      # once both support 5.
      - dependency-name: vitest
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitest/*"
        update-types: ["version-update:semver-major"]
      # The Node types follow the Node version in .nvmrc.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # Keeps the SHA-pinned actions in the workflows current: "ci(deps): bump …".
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
